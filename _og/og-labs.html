<!doctype html>
<!-- Source for /og-labs.png (1200x630), the Labs page share image. Not published: Jekyll skips folders that start with an underscore.
     Regenerate: serve the repo root locally, open /_og/og.html in headless Chrome at a 1200x630 viewport,
     device scale 1, and screenshot. Uses the site's own fonts, logo and illustration. -->
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="/site.css">
<style>
  html,body { margin:0; width:1200px; height:630px; overflow:hidden; }
  body { background: var(--cream); }
  .og { position:absolute; inset:0; display:grid; grid-template-columns: 1fr 470px; gap:32px; align-items:center; padding:48px 64px 88px; }
  .og h1 { font-size:68px; line-height:1.02; margin-top:22px; }
  .og .pill { font-size:22px; padding:6px 16px; margin:0; }
  .brandbar { position:absolute; left:0; right:0; bottom:0; height:78px; border-top:3px solid var(--ink); background: var(--sun); display:flex; align-items:center; justify-content:space-between; padding:0 64px; }
  .brandbar img { height:44px; }
  .brandbar span { font-family: var(--text); font-weight:600; font-size:28px; }
  .art svg { width:100%; height:auto; overflow:visible; }
</style></head>
<body>
<svg width="0" height="0" class="sr-only" aria-hidden="true" focusable="false">
