<!doctype html>
<!-- Source for /og.png (1200x630). Not published: Jekyll skips folders that start with an underscore.
     Regenerate: serve the repo root locally, open /_og/og.html in headless Chrome at a 1200x630 viewport,
     device scale 1, and screenshot. Uses the site's own fonts, logo and illustration. -->
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<link rel="stylesheet" href="/site.css">
<style>
  html,body { margin:0; width:1200px; height:630px; overflow:hidden; }
  body { background: var(--cream); }
  .og { position:absolute; inset:0; display:grid; grid-template-columns: 1fr 470px; gap:32px; align-items:center; padding:48px 64px 88px; }
  .og h1 { font-size:68px; line-height:1.02; margin-top:22px; }
  .og .pill { font-size:22px; padding:6px 16px; margin:0; }
  .brandbar { position:absolute; left:0; right:0; bottom:0; height:78px; border-top:3px solid var(--ink); background: var(--sun); display:flex; align-items:center; justify-content:space-between; padding:0 64px; }
  .brandbar img { height:44px; }
  .brandbar span { font-family: var(--text); font-weight:600; font-size:28px; }
  .art svg { width:100%; height:auto; overflow:visible; }
</style></head>
<body>
<svg width="0" height="0" class="sr-only" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="s-mail" viewBox="0 0 100 90">
      <rect x="6" y="14" width="88" height="62" rx="9"/>
      <path class="flap" d="M10,20 L50,50 L90,20"/>
      <circle class="d" cx="82" cy="16" r="12"/>
      <rect x="80" y="8" width="4" height="10" rx="2" fill="var(--cream)"/>
      <circle cx="82" cy="22" r="2.2" fill="var(--cream)"/>
    </symbol>
    <symbol id="s-chat" viewBox="0 0 100 90">
      <path d="M90,8 h-80 a8,8 0 0 0 -8,8 v44 a8,8 0 0 0 8,8 h50 l16,14 v-14 h14 a8,8 0 0 0 8,-8 v-44 a8,8 0 0 0 -8,-8z"/>
      <path class="d" d="M50,56 C 30,42 31,22 43,22 C 47,22 50,26 50,29 C 50,26 53,22 57,22 C 69,22 70,42 50,56Z"/>
    </symbol>
    <symbol id="s-agent" viewBox="0 0 100 90">
      <rect x="4" y="10" width="76" height="58" rx="9"/>
      <g class="d"><rect x="14" y="22" width="34" height="7" rx="3.5"/><rect x="14" y="36" width="48" height="7" rx="3.5"/><rect x="14" y="50" width="22" height="7" rx="3.5"/></g>
      <path class="l" d="M56,34 v44 l11,-10 l9,18 l9,-4.5 l-9,-18 l15,-1z"/>
    </symbol>
    <symbol id="s-text" viewBox="0 0 100 90">
      <rect x="28" y="2" width="44" height="86" rx="10"/>
      <rect class="l" x="35" y="18" width="30" height="12" rx="6"/>
      <rect class="d" x="41" y="36" width="24" height="12" rx="6"/>
      <rect class="d" x="43" y="78" width="14" height="4" rx="2"/>
    </symbol>
  </defs>
</svg>
<div class="og">
  <div>
    <p class="pill">In development. Early access is open.</p>
    <h1>One AI that protects you <span class="warm">from the rest.</span></h1>
  </div>

          <circle cx="280" cy="212" r="8" fill="var(--cream)" stroke="var(--ink)" stroke-width="3"/>

          <g class="settle" transform="translate(0 300) rotate(5 50 45)"><use href="#s-agent" width="100" height="90" class="shadow" transform="translate(5 5)"/><use href="#s-agent" width="100" height="90" class="stk" fill="var(--sun)"/></g>

        </svg></div>
</div>
<div class="brandbar"><img src="/brand/logo.svg" alt=""><span>heyaiactually.com</span></div>
</body></html>
